<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ministerio</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBvOkBH0ImFiOqPtLUCHBArThzwKFbdG10",
            authDomain: "ministerio-app-2024.firebaseapp.com",
            databaseURL: "https://ministerio-app-2024-default-rtdb.firebaseio.com",
            projectId: "ministerio-app-2024",
            storageBucket: "ministerio-app-2024.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };
        
        window.firebaseApp = initializeApp(firebaseConfig);
        window.database = getDatabase(window.firebaseApp);
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ministracion Barrio Libertador</h1>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Buscar hermano o familia..." class="search-input">
                <select id="localidadFilter" class="filter-select">
                    <option value="">Todas las localidades</option>
                    <option value="Santa cruz">Santa cruz</option>
                    <option value="Libertador 1">Libertador 1</option>
                    <option value="Palo negro">Palo negro</option>
                </select>
            </div>
            <div class="controls">
                <button id="addHermano" class="btn btn-primary">+ Hermano Ministrante</button>
                <button id="addFamilia" class="btn btn-secondary">+ Familia</button>
            </div>
        </header>

        <main id="mainContent">
            <!-- Las columnas se generarán dinámicamente -->
        </main>
    </div>

    <!-- Modal para añadir/editar -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Añadir Elemento</h2>
            <form id="itemForm">
                <input type="text" id="itemName" placeholder="Nombre" required>
                <select id="localidadSelect" class="form-select">
                    <option value="">Seleccionar localidad</option>
                    <option value="Santa cruz">Santa cruz</option>
                    <option value="Libertador 1">Libertador 1</option>
                    <option value="Palo negro">Palo negro</option>
                </select>
                <select id="companeroSelect" class="form-select" style="display:none;">
                    <option value="">Sin compañero</option>
                </select>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
